name: Yorkie Instagram Insights

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'
    - cron: '0 12 * * *'
    - cron: '0 14 * * *'

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      data_changed: ${{ steps.commit_data.outputs.data_changed }}
      source_commit: ${{ steps.commit_data.outputs.source_commit }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect insights
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_VERSION: v26.0
        run: python collector.py

      - name: Build read-only endpoint
        run: python analyzer.py

      - name: Test endpoint
        run: python -m unittest discover -s tests -v

      - name: Commit data
        id: commit_data
        shell: bash
        run: |
          set -euo pipefail
          echo "data_changed=false" >> "$GITHUB_OUTPUT"
          echo "source_commit=" >> "$GITHUB_OUTPUT"

          test -f docs/api/insights/latest.json
          mkdir -p api/insights
          cp docs/api/insights/latest.json api/insights/latest.json
          cmp --silent docs/api/insights/latest.json api/insights/latest.json
          python scripts/validate_payload.py api/insights/latest.json

          git config user.name "yorkie-insights-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/api/insights/latest.json api/insights/latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Instagram Insights"
          git push
          echo "data_changed=true" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload endpoint artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy read-only endpoint
        id: deployment
        uses: actions/deploy-pages@v4

  email:
    needs: collect
    if: needs.collect.outputs.data_changed == 'true'
    uses: ./.github/workflows/yorkie-insights-email.yml
    with:
      source_commit: ${{ needs.collect.outputs.source_commit }}
    secrets:
      GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      INSIGHTS_EMAIL_TO: ${{ secrets.INSIGHTS_EMAIL_TO }}
