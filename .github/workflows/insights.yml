name: Yorkie Instagram Insights

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'
    - cron: '0 12 * * *'
    - cron: '0 14 * * *'

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect insights
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_VERSION: v26.0
        run: python collector.py

      - name: Build read-only endpoint
        run: python analyzer.py

      - name: Test endpoint
        run: python -m unittest discover -s tests -v

      - name: Commit data
        run: |
          git config user.name "yorkie-insights-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/api/insights/latest.json
          git diff --cached --quiet || git commit -m "Update Instagram Insights"
          git push

      - name: Upload endpoint artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy read-only endpoint
        id: deployment
        uses: actions/deploy-pages@v4
